<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Inicio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <aside class="sidebar">
      <h1>Natura<br />Graciela</h1>
      <nav>
        <a class="active" href="index.html">Home</a>
        <a href="productos.html">Productos</a>
        <a href="clientes.html">Clientes</a>
        <a href="ventas.html">Ventas</a>
      </nav>
    </aside>

    <main class="content">
      <h2 class="title">Natura</h2>

      <section class="card">
        <div class="muted" id="rangoExp">(vencen en los próximos 60 días)</div>
        <h3>Productos por vencer</h3>
        <table id="tbl-exp">
          <thead>
            <tr>
              <th>Producto</th>
              <th>Detalle</th>
              <th class="right">Precio</th>
              <th>Vencimiento</th>
              <th class="right">Cantidad</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <section class="card">
        <div class="muted" id="rangoDues">
          (cuotas con vencimiento en los próximos 7 días)
        </div>
        <h3>Cuotas próximas a vencer</h3>
        <table id="tbl-dues">
          <thead>
            <tr>
              <th>Cliente</th>
              <th># Cuota</th>
              <th>Fecha de vencimiento</th>
              <th class="right">Total a pagar</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
